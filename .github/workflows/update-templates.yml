name: Auto-update templates

# Periodically checks every srcpkgs/*/template, cosmic/*/template and
# hyprland/*/template against upstream (GitHub / Codeberg releases and tags) and opens a PR
# when a newer, verified version is found. See scripts/update_templates.py
# for exactly what "verified" means and which sources are supported.

on:
  schedule:
    # Every 3 days at 04:00 UTC. Cron's day-of-month field resets each
    # month, so this actually fires on days 1/4/7/.../31 of every month
    # (occasionally 2 days apart at the month boundary) rather than a
    # perfectly rolling 3-day cadence -- close enough for this purpose.
    - cron: "0 4 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: update-templates
  cancel-in-progress: false

jobs:
  keepalive:
    # GitHub disables scheduled workflows after 60 days without repository
    # activity. This re-enables the workflow through the API on every
    # scheduled run, without creating commits.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1

  update-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check templates for updates
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SUMMARY_PATH: ${{ github.workspace }}/update-summary.md
          MANUAL_SUMMARY_PATH: ${{ github.workspace }}/manual-summary.md
        run: python3 scripts/update_templates.py

      - name: Open pull request
        if: steps.update.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "templates: automated version/checksum update"
          branch: auto/update-templates
          delete-branch: true
          title: "Automated template update (${{ steps.update.outputs.updated_count }} package(s))"
          body-path: update-summary.md
          labels: automated,templates
          add-paths: |
            srcpkgs/*/template
            cosmic/*/template
            hyprland/*/template

      # Packages in MANUAL_UPDATES (librewolf, mullvad-browser) are never
      # edited by the bot, so a new version of one alone opens no PR. Keep a
      # single issue open while any of them has a newer upstream version,
      # and close it once the templates have caught up.
      - name: Track manual updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_MANUAL: ${{ steps.update.outputs.has_manual }}
        run: |
          title="Manual template updates available"
          gh label create manual-update --color FBCA04 \
            --description "New upstream version the bot can't update" 2>/dev/null || true
          issue=$(gh issue list --state open --label manual-update --json number --jq '.[0].number')
          if [ "$HAS_MANUAL" = "true" ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file manual-summary.md
            else
              gh issue create --title "$title" --label manual-update --body-file manual-summary.md
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "All manual updates are done."
          fi
